# Generated from Muxcore-Media/umbrella scripts/ci-templates/go-module-release.yml
# by scripts/sync-ci.sh — edit the template, not this copy (ADR-0003).
# Builds release binaries for a module tag. Container images are built centrally
# from the umbrella (_mvp/scripts/publish-module-images.sh), not per module.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOPRIVATE: github.com/Muxcore-Media/*
  GONOSUMDB: github.com/Muxcore-Media/*

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Private module access
        env:
          TOKEN: ${{ secrets.MUXCORE_CI_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/Muxcore-Media/".insteadOf "https://github.com/Muxcore-Media/"
          fi
      - name: Build binaries
        # Optional repo variables: RELEASE_ENTRY (main package, default
        # ./cmd/module or .) and RELEASE_LDFLAGS (extra -ldflags; ${VERSION}
        # expands to the tag).
        env:
          RELEASE_ENTRY: ${{ vars.RELEASE_ENTRY }}
          RELEASE_LDFLAGS: ${{ vars.RELEASE_LDFLAGS }}
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          entry="${RELEASE_ENTRY:-./cmd/module}"
          [ -d "$entry" ] || entry=.
          extra="${RELEASE_LDFLAGS//\$\{VERSION\}/${GITHUB_REF_NAME}}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} ${extra}" \
              -o "dist/${name}-${os}-${arch}" "$entry"
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
