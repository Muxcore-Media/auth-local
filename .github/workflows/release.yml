name: Release
on:
  push:
    tags: ["v*"]

jobs:
  goreleaser:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          path: core
          repository: Muxcore-Media/core
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          path: auth-local
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: Build binaries
        working-directory: ./auth-local
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/auth-local-linux-amd64 ./cmd/module
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/auth-local-linux-arm64 ./cmd/module
      - name: Lowercase image name
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./auth-local
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/auth-local:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_OWNER }}/auth-local:latest
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: auth-local/dist/*
          generate_release_notes: true
