# auth-local RBAC Policy
#
# Permission matching:
#   "*"            — superuser (all actions on all resources)
#   "resource.*"   — all actions on a resource (e.g., "media.*")
#   "resource.action" — specific action (e.g., "media.view")
#   "*.action"     — specific action on any resource

roles:
  admin:
    permissions: ["*"]
  manager:
    permissions:
      - "media.*"
      - "storage.*"
      - "modules.read"
      - "modules.manage"
  user:
    permissions:
      - "media.request"
      - "media.view"
      - "media.search"
  viewer:
    permissions:
      - "media.view"
      - "media.search"
  module:
    permissions:
      - "*./muxcore.storage.v1.StorageService/Put"
      - "*./muxcore.storage.v1.StorageService/Get"
      - "*./muxcore.storage.v1.StorageService/Delete"
      - "*./muxcore.storage.v1.StorageService/List"
      - "*./muxcore.auth.v1.AuthService/Validate"
      - "*./muxcore.auth.v1.AuthService/Can"
      - "*./muxcore.auth.v1.AuthService/ExtractIdentity"
