<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MuxCore Auth — Two-Factor</title>
<style>
*,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb}
html{font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px}
body{margin:0;min-height:100vh}
.flex{display:flex}.items-center{align-items:center}.justify-center{justify-content:center}
.text-center{text-align:center}.w-full{width:100%}
.max-w-sm{max-width:24rem}.mx-auto{margin:0 auto}
.px-4{padding-left:1rem;padding-right:1rem}.px-3{padding-left:.75rem;padding-right:.75rem}
.py-2{padding-top:.5rem;padding-bottom:.5rem}
.p-8{padding:2rem}
.mb-1{margin-bottom:.25rem}.mb-4{margin-bottom:1rem}.mb-8{margin-bottom:2rem}
.mt-1{margin-top:.25rem}.mt-4{margin-top:1rem}
.space-y-4>*+*{margin-top:1rem}
.text-sm{font-size:.875rem}.text-xl{font-size:1.25rem}.text-2xl{font-size:1.5rem}
.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}
.text-white{color:#f3f4f6}.text-gray-300{color:#d1d5db}.text-gray-400{color:#9ca3af}.text-gray-500{color:#6b7280}
.text-red-400{color:#f87171}
.bg-gray-950{background:#030712}.bg-gray-800{background:#1f2937}
.bg-indigo-600{background:#4f46e5}
.border{border-width:1px}.border-gray-700{border-color:#374151}
.rounded-lg{border-radius:.5rem}.rounded-xl{border-radius:.75rem}
.hover\:bg-indigo-500:hover{background:#6366f1}
.focus\:outline-none:focus{outline:0}.focus\:ring-1:focus{box-shadow:0 0 0 1px #4f46e5}
.transition-colors{transition-property:color,background-color,border-color}
.cursor-pointer{cursor:pointer}.antialiased{-webkit-font-smoothing:antialiased}
.w-12{width:3rem}.h-12{height:3rem}
.block{display:block}
</style>
</head>
<body class="flex items-center justify-center antialiased">
<div class="w-full max-w-sm p-8">
<div class="text-center mb-8">
<div class="mx-auto w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-xl font-bold mb-4">M</div>
<h1 class="text-2xl font-bold text-white">Two-Factor Authentication</h1>
<p class="text-gray-400 mt-1 text-sm">Enter the code from your authenticator app</p>
</div>

{{if .Error}}
<div class="rounded-lg bg-red-900/50 border border-red-800 px-4 py-2 text-sm text-red-400 mb-4">{{.Error}}</div>
{{end}}

<form method="POST" action="/login/totp" class="space-y-4">
<input type="hidden" name="partial_token" value="{{.PartialToken}}"/>
<input type="hidden" name="redirect" value="{{.Redirect}}"/>
<input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>
<div>
<label for="totp_code" class="block text-sm font-medium text-gray-300 mb-1">Authenticator Code</label>
<input type="text" id="totp_code" name="totp_code" required autocomplete="off" autofocus
inputmode="numeric" pattern="[0-9]*" maxlength="6"
class="w-full rounded-lg border border-gray-700 bg-gray-800 px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-1 border-gray-700 text-center text-2xl tracking-widest"
placeholder="000000"/>
</div>
<button type="submit"
class="w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-500 transition-colors cursor-pointer">
Verify
</button>
</form>

<p class="text-center text-xs text-gray-500 mt-4">MuxCore Auth</p>
</div>
</body>
</html>
