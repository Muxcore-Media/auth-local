<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MuxCore Auth</title>
<style>
*,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb}
html{font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px}
body{margin:0;min-height:100vh}
.flex{display:flex}.items-center{align-items:center}.justify-center{justify-content:center}
.text-center{text-align:center}.w-full{width:100%}
.max-w-sm{max-width:24rem}.mx-auto{margin:0 auto}
.px-4{padding-left:1rem;padding-right:1rem}.px-3{padding-left:.75rem;padding-right:.75rem}
.py-2{padding-top:.5rem;padding-bottom:.5rem}
.p-8{padding:2rem}.p-4{padding:1rem}
.mb-1{margin-bottom:.25rem}.mb-2{margin-bottom:.5rem}.mb-4{margin-bottom:1rem}.mb-8{margin-bottom:2rem}
.mt-1{margin-top:.25rem}.mt-4{margin-top:1rem}
.space-y-4>*+*{margin-top:1rem}
.text-xs{font-size:.75rem}.text-sm{font-size:.875rem}.text-xl{font-size:1.25rem}.text-2xl{font-size:1.5rem}
.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}
.text-white{color:#f3f4f6}.text-gray-300{color:#d1d5db}.text-gray-400{color:#9ca3af}.text-gray-500{color:#6b7280}
.text-red-400{color:#f87171}.text-green-400{color:#34d399}
.bg-gray-950{background:#030712}.bg-gray-900{background:#111827}.bg-gray-800{background:#1f2937}
.bg-indigo-600{background:#4f46e5}
.border{border-width:1px}.border-gray-800{border-color:#1f2937}.border-gray-700{border-color:#374151}
.rounded-lg{border-radius:.5rem}.rounded-xl{border-radius:.75rem}
.hover\:bg-indigo-500:hover{background:#6366f1}
.focus\:outline-none:focus{outline:0}.focus\:ring-1:focus{box-shadow:0 0 0 1px #4f46e5}
.transition-colors{transition-property:color,background-color,border-color}
.cursor-pointer{cursor:pointer}.antialiased{-webkit-font-smoothing:antialiased}
.w-12{width:3rem}.h-12{height:3rem}
.block{display:block}.hidden{display:none}
</style>
</head>
<body class="flex items-center justify-center antialiased">
<div class="w-full max-w-sm p-8">
<div class="text-center mb-8">
<div class="mx-auto w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-xl font-bold mb-4">M</div>
<h1 class="text-2xl font-bold text-white">MuxCore Auth</h1>
<p class="text-gray-400 mt-1 text-sm">Sign in to continue</p>
</div>

{{if .Error}}
<div class="rounded-lg bg-red-900/50 border border-red-800 px-4 py-2 text-sm text-red-400 mb-4">{{.Error}}</div>
{{end}}

<form method="POST" action="/login" class="space-y-4">
<input type="hidden" name="redirect" value="{{.Redirect}}"/>
<input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>
<div>
<label for="username" class="block text-sm font-medium text-gray-300 mb-1">Username</label>
<input type="text" id="username" name="username" required autocomplete="username" autofocus
class="w-full rounded-lg border border-gray-700 bg-gray-800 px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-1 border-gray-700"
placeholder="admin"/>
</div>
<div>
<label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
<input type="password" id="password" name="password" required autocomplete="current-password"
class="w-full rounded-lg border border-gray-700 bg-gray-800 px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-1 border-gray-700"
placeholder="password"/>
</div>

<div id="passkey-section" class="hidden"></div>

<button type="submit"
class="w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-500 transition-colors cursor-pointer">
Sign in
</button>
</form>

{{if .HasPasskeys}}
<div class="mt-4 text-center">
<button id="passkey-login-btn"
class="text-sm text-indigo-400 hover:text-indigo-300 cursor-pointer"
onclick="beginPasskeyLogin()">Sign in with passkey</button>
</div>
{{end}}

<p class="text-center text-xs text-gray-500 mt-4">MuxCore Auth</p>
</div>

<script>
var webauthnOrigin = window.location.origin;

function beginPasskeyLogin() {
var username = document.getElementById('username').value;
if (!username) { return; }
fetch(webauthnOrigin + '/api/webauthn/login/begin?username=' + encodeURIComponent(username))
.then(function(r) { return r.json(); })
.then(function(opts) {
opts.publicKey.challenge = base64urlToArray(opts.publicKey.challenge);
if (opts.publicKey.allowCredentials) {
opts.publicKey.allowCredentials.forEach(function(c) { c.id = base64urlToArray(c.id); });
}
return navigator.credentials.get(opts);
})
.then(function(cred) {
var body = JSON.stringify({
id: cred.id,
rawId: arrayToBase64url(new Uint8Array(cred.rawId)),
type: cred.type,
response: {
clientDataJSON: arrayToBase64url(new Uint8Array(cred.response.clientDataJSON)),
authenticatorData: arrayToBase64url(new Uint8Array(cred.response.authenticatorData)),
signature: arrayToBase64url(new Uint8Array(cred.response.signature)),
userHandle: cred.response.userHandle ? arrayToBase64url(new Uint8Array(cred.response.userHandle)) : null,
},
});
var redirect = '{{.Redirect}}';
return fetch(webauthnOrigin + '/api/webauthn/login/complete?redirect=' + encodeURIComponent(redirect), {
method: 'POST', headers: {'Content-Type': 'application/json'}, body: body,
});
})
.then(function(r) { return r.json(); })
.then(function(data) {
if (data.redirect && data.session_token) {
var target = data.redirect;
target += (target.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(data.session_token);
window.location.href = target;
}
});
}

function base64urlToArray(str) {
str = str.replace(/-/g, '+').replace(/_/g, '/');
while (str.length % 4) str += '=';
return Uint8Array.from(atob(str), function(c) { return c.charCodeAt(0); }).buffer;
}
function arrayToBase64url(arr) {
var binary = '';
arr.forEach(function(b) { binary += String.fromCharCode(b); });
return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
</script>
</body>
</html>
