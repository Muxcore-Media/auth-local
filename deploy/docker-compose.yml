services:
  core:
    image: ghcr.io/muxcore-media/core:latest
    ports:
      - "9090:9090"
    environment:
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  auth-local:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9400:9400"
      - "9401:9401"
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: auth-local
      AUTH_GRPC_ADDR: ":9400"
      AUTH_HTTP_ADDR: ":9401"
      AUTH_DB_PATH: /var/lib/muxcore/auth.db
      AUTH_POLICY_FILE: /etc/muxcore/policies.yaml
      AUTH_RP_ID: localhost
      AUTH_RP_ORIGINS: http://localhost:9401
      AUTH_RP_NAME: MuxCore
    volumes:
      - auth-data:/var/lib/muxcore
      - ../policies.yaml:/etc/muxcore/policies.yaml:ro
    depends_on:
      core:
        condition: service_healthy

volumes:
  auth-data:
