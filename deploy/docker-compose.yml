services:
  auth-local:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9041:9041"
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_GRPC_INSECURE: "true"
      MUXCORE_GRPC_SEED_NODES: core-2:9090
      AUTH_GRPC_ADDR: :9400
      AUTH_HTTP_ADDR: :9041
      AUTH_DB_PATH: /data/auth.db
    volumes:
      - auth-data:/data
